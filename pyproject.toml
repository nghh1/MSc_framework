[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garl-trading"
version = "0.1.0"
description = "Machine Learning framework for comparing GARL with statistical, supervised, RL, and passive trading baselines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "statsmodels>=0.14,<1",
  "torch>=2.2,<3",
  "gymnasium>=0.29,<2",
  "optuna>=3.6,<5",
  "matplotlib>=3.8,<4",
  "yfinance>=0.2.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1"]

[project.scripts]
garl-trading = "garl_trading.cli:main"

[tool.setuptools.packages.find]
include = ["garl_trading*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

