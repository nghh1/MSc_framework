[experiment]
name = "garl_main"
seed = 42
repetitions = 5
artifacts_dir = "artifacts"

[data]
start = "2001-01-01"
end = "2025-12-31"
tickers = ["NVDA", "AAPL", "MSFT", "JPM", "BAC", "MS", "CAT", "RTX", "BA"]
adjust_prices = true

[validation]
outer_folds = 5
inner_folds = 3
min_train_bars = 1260
max_train_bars = 1864
embargo_bars = 1
final_holdout_start = "2021-01-01"
use_final_holdout = true

[execution]
initial_capital = 100000.0
transaction_cost_bps = 5.0
slippage_bps = 2.0
short_borrow_bps_annual = 0.0
position_levels = [-1.0, -0.5, 0.0, 0.5, 1.0]

[models]
supervised = ["arimax_static", "arimax_rolling", "random_forest", "lstm", "tcn", "tft"]
rl = [
  "single_a2c", "single_ppo", "single_dqn",
  "independent_a2c", "independent_ppo", "independent_dqn",
  "garl_ddal"
]
lookback = 20
train_epochs = 100
rollout_length = 32
learning_rate = 0.0003
gamma = 0.95
device = "mps"

[tuning]
enabled = true
trials = 15
rl_trials = 5
objective = "sharpe"

[reporting]
formats = ["png", "csv", "md"]
confidence_level = 0.95
