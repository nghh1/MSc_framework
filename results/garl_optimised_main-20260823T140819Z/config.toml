[experiment]
name = "garl_optimised_main"
seed = 42
repetitions = 10
artifacts_dir = "results"

[data]
start = "2001-01-01"
end = "2025-12-31"
tickers = ["NVDA", "AAPL", "MSFT", "JPM", "BAC", "MS", "CAT", "RTX", "BA"]
adjust_prices = true
target_horizon = 5

[validation]
outer_folds = 5
inner_folds = 3
min_train_bars = 1260
max_train_bars = 1864
embargo_bars = 5
final_holdout_start = "2023-01-01"
use_final_holdout = true

[execution]
initial_capital = 100000.0
transaction_cost_bps = 5.0
slippage_bps = 2.0
short_borrow_bps_annual = 50.0
position_levels = [-1.0, 0.0, 1.0]
decision_interval = 5
# Active targets are evaluated every five trading days and retained when the proposed change from
# the drifted pre-trade exposure is no greater than 0.20.
rebalance_threshold = 0.20

[models]
supervised = ["arimax_static", "arimax_rolling", "random_forest", "lstm", "tcn", "transformer"]
rl = [
  "single_a2c", "single_ppo", "single_dqn",
  "independent_a2c", "independent_ppo", "independent_dqn",
  "garl_ddal", "selective_garl_ddal"
]
lookback = 20
# Shared constrained mean-variance risk aversion for every supervised model and stock.
supervised_risk_aversion = 10.0
rl_feature_extractor = "tcn"
rl_encoder_channels = 32
rl_encoder_kernel_size = 3
rl_encoder_dilations = [1, 2, 4, 8]
# Dropout is disabled because stochastic feature masking invalidates PPO likelihood ratios.
rl_encoder_dropout = 0.0
train_epochs = 100
rollout_length = 32
learning_rate = 0.0003
gamma = 0.95
# RL training charges twice the true turnover cost as a fixed anti-churn regulariser.
turnover_penalty_multiplier = 2.0
device = "auto"
# Zero disables checkpoint stopping/restoration; all RL models keep their final fixed-step weights.
early_stopping_patience = 0
early_stopping_min_delta = 0.0001
minimum_train_epochs = 30
garl_share_after_fraction = 0.3
garl_share_every = 2
garl_pool_size = 3
# Zero admits any strictly positive alignment when tuning is disabled; tuning tests stricter filters.
selective_garl_alignment_threshold = 0.0
# At selective sharing events, retain half the local gradient and admit at most half peer knowledge.
selective_garl_peer_mix = 0.5

[tuning]
enabled = true
trials = 15
rl_trials = 9
objective = "sharpe"

[reporting]
formats = ["png", "csv", "md"]
confidence_level = 0.95
